name: rc-testing

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Release candidate testing on Linux with remote data
            os: ubuntu-latest
            python: "3.14"
            toxenv: py312-test-alldeps-predeps
            toxposargs: --remote-data

          - name: Release candidate testing on OSX
            os: macos-latest
            python: "3.12"
            toxenv: py311-test-alldeps-predeps

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip tox
      - name: Run tests
        run: tox -e ${{ matrix.toxenv }} -- ${{ matrix.toxposargs }}
